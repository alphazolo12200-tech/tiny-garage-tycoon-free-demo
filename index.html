<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Run a tiny repair shop in your browser. Fix brakes, wiring faults and flat tires in quick mini-games, hire help, upgrade your tools and grow your garage.">
<title>Tiny Garage Tycoon (Free Demo)</title>
<style>
:root{--bg:#1b1f23;--panel:#262c32;--line:#3a424a;--ink:#ece8dd;--dim:#9aa3ab;--yel:#f2b630;--teal:#3fa796;--rust:#e0553a;--blue:#4a7fd1}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif}
h1{font:400 1.5rem Impact,"Arial Narrow",sans-serif;letter-spacing:.02em;margin:0;color:var(--yel);text-shadow:2px 2px 0 #000}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:.7rem;padding:.35rem .7rem;background:var(--panel);border-bottom:3px solid var(--yel)}
.stats{display:flex;gap:.8rem;font-weight:700;flex:1;white-space:nowrap;font-size:.95rem}
#vol{width:84px;flex:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5rem;padding:.5rem}
#sceneWrap{flex:none;display:flex;justify-content:center}
#scene{width:min(100%,calc(36dvh*360/250));aspect-ratio:360/250;display:block;border:3px solid var(--yel);border-radius:8px;background:#1d2125;touch-action:manipulation;cursor:pointer}
#panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
#tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;min-width:0;border:0;border-radius:0;border-bottom:3px solid transparent;background:transparent;padding:.2rem;font-size:.9rem}
#tabs button.on{border-bottom-color:var(--yel);color:var(--yel);font-weight:700}
#panes{flex:1;min-height:0;overflow:auto;padding:.6rem}
.pane{display:none}.pane.on{display:block}
#ctl{flex:none;display:flex;gap:.3rem;padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom));background:var(--panel);border-top:3px solid var(--yel)}
#ctl button{flex:1;min-width:0;padding:.2rem 0;font-size:.8rem}
#bSound.off{text-decoration:line-through;opacity:.7}
a{color:var(--yel)}
button{font:inherit;min-height:44px;padding:.3rem .8rem;border:2px solid var(--line);background:#323a42;color:var(--ink);border-radius:6px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--yel)}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.go{background:var(--yel);color:#201a05;border-color:var(--yel);font-weight:700}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}#shopList{display:grid;gap:.5rem}
.job,.bay,.item{border:1px solid var(--line);border-radius:6px;padding:.4rem .5rem;display:flex;gap:.5rem;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item{flex-wrap:nowrap}.item button{flex:none}.job .go{margin-left:auto}
.bay{border:4px solid transparent;border-image:repeating-linear-gradient(135deg,var(--yel) 0 10px,#222 10px 20px) 4;margin-bottom:.5rem;background:#1f252a}
.bar{height:10px;background:#12161a;border-radius:5px;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--teal)}.bar.pat>i{background:var(--yel)}
.dim{color:var(--dim);font-size:.9rem}.done{color:var(--teal)}
#modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10;padding:1rem}
#modal[hidden]{display:none}
.card{background:var(--panel);border:2px solid var(--yel);border-radius:10px;padding:1rem;max-width:480px;width:100%;max-height:92vh;overflow:auto}
#mBtns{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.8rem;flex-wrap:wrap}
#modal.sheet{background:transparent;align-items:end;pointer-events:none;padding:0}
#modal.sheet .card{pointer-events:auto;max-width:560px;border-radius:12px 12px 0 0;max-height:56vh}
.gbar{position:relative;height:34px;background:#12161a;border-radius:6px;margin:.6rem 0}
.zone{position:absolute;top:0;bottom:0;background:#3fa79680;border:2px solid var(--teal)}
.mark{position:absolute;top:-4px;bottom:-4px;width:6px;background:var(--rust);border-radius:3px;transform:translateX(-3px)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.6rem 0}
.pad{min-height:70px;opacity:.55;border:3px solid #0006}.pad.lit{opacity:1;filter:brightness(1.4);transform:scale(.97)}
.big{width:100%;min-height:56px;font-size:1.1rem}
#toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:var(--yel);color:#201a05;padding:.5rem 1rem;border-radius:6px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:92vw;text-align:center}
#toast.on{opacity:1}#toast.err{background:var(--rust);color:#fff}
@media(max-width:520px){h1{display:none}.stats{gap:.6rem;font-size:.9rem}}
@media(min-width:900px){
  #stage{flex-direction:row;gap:.8rem;padding:.8rem}
  #sceneWrap{flex:1.5;align-items:flex-start;min-width:0}
  #scene{width:min(100%,calc((100dvh - 170px)*360/250))}
  #panel{flex:1;max-width:520px}
  #modal.sheet{place-items:end end;padding:0 .8rem .8rem}
  #modal.sheet .card{max-width:430px;border-radius:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* compact fit for short screens */
#panes{padding:.4rem}#shopList{gap:.3rem}.item{padding:.15rem .5rem}
@media(max-height:700px){#scene{width:min(100%,calc(29dvh*360/250))}#stage{gap:.35rem;padding:.35rem .5rem}}
#tabs button{white-space:nowrap;font-size:.84rem}

/* levels + staff */
#xpbar{flex:none;height:4px;background:#12161a}#xpfill{display:block;height:100%;width:0;background:var(--teal)}
#staffList{display:grid;gap:.3rem}#tabs button{font-size:.78rem}
#vol{width:70px}
@media(max-width:420px){#top{gap:.4rem;padding:.35rem .5rem}.stats{gap:.4rem;font-size:.8rem}#vol{width:52px}}
@media(max-width:420px){.stats{gap:.3rem}#vol{width:46px}#top{gap:.3rem}}
textarea{width:100%;background:#12161a;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:12px/1.3 monospace;padding:.4rem;resize:none}

/* fuel station + larger staff */
.staffgrid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin:.3rem 0}.staffgrid .item{padding:.2rem .4rem;font-size:.85rem}
#fuelList{display:grid;gap:.3rem}.holdbtn{touch-action:none;user-select:none;-webkit-user-select:none}
@media(max-width:520px){#tabs button{font-size:.7rem;padding:.2rem 0}}
#demoTag{flex:none;background:var(--yel);color:#201a05;font-weight:800;font-size:.7rem;letter-spacing:.06em;padding:.1rem .4rem;border-radius:4px}
@media(max-width:420px){#demoTag{font-size:.58rem;padding:.05rem .22rem;letter-spacing:.02em}}

</style></head><body>
<div id="app">
  <header id="top">
    <h1>Tiny Garage</h1>

        <div class="pane" role="tabpanel" data-pane="queue"><ul id="qList"></ul></div>
        <div class="pane" role="tabpanel" data-pane="shop"><div id="shopList"></div></div>
        <div class="pane" role="tabpanel" data-pane="staff"><div id="staffList"></div></div>
        <div class="pane" role="tabpanel" data-pane="fuel"><div id="fuelList"></div></div>
        <div class="pane" role="tabpanel" data-pane="ach"><ul id="achList"></ul></div>
        <div class="pane" role="tabpanel" data-pane="logp"><ul id="log"></ul></div>
      </div>
    </section>
  </div>
  <footer id="ctl">
    <button id="bPause">Pause</button><button id="bSound">Sound</button><button id="bSave">Save</button>
    <button id="bLoad">Load</button><button id="bHelp">Help</button><button id="bRestart">Restart</button>
  </footer>
</div>
<div id="modal" hidden><div class="card" role="dialog" aria-modal="true"><div id="mBody"></div><div id="mBtns"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Tiny Garage Tycoon needs JavaScript.</noscript>
<script>

};
const tier = j => j.tier || 1;
const tname = j => ['', 'Major ', 'Premium ', 'Elite '][tier(j) - 1] + TYPES[j.type].name;
const jl = j => LABEL[j.type] + ['', '', ' II', ' III', ' IV'][tier(j)];
const skill = w => clamp(1 + Math.floor((w.jobs || 0) / 6), 1, S.train ? 7 : 5);
function level() { let l = 1; for (let i = 1; i < LV.length; i++) if (S.xp >= LV[i]) l = i + 1; return l; }
/* chance an employee botches a job: falls with tool level and skill, hits 0 when fully upgraded */
const failP = (t, tool, sk) => Math.max(0, FAIL0[t] - 0.045 * tool - 0.05 * (sk - 1));
const jobTime = (j, w) => 16 * (1 + 0.35 * (tier(j) - 1)) / (1 + 0.15 * S.tools[TYPES[j.type].tool]) / (1 + 0.1 * (skill(w) - 1)) * (VEH[j.veh] || VEH.sedan).time;
const FUEL = { fuel: { name: 'Refuel', base: 18, game: 'fill' }, charge: { name: 'EV charge', base: 30, game: 'charge' } };
const maxStaff = () => DEMO ? 2 : S.bays >= 4 ? (level() >= 12 ? 6 : 4) : 3;
const fsJob = k => (k[0] === 'f' ? S.fuelSlots : S.evSlots)[+k[1]];

const fuelFail = (up, sk) => Math.max(0, 0.08 - 0.035 * up - 0.03 * (sk - 1));
function findFuel() { for (const k of ['f0', 'f1', 'e0', 'e1']) { const j = fsJob(k); if (j && j.state === 'waiting') return k; } return null; }

/* ---------- feedback ---------- */
function toast(msg, err) {

let AC = null, master = null, sfxBus = null, musBus = null, analyser = null, noiseBuf = null, unlocked = false, musicOn = false, musicTimer = null, mStep = 0, nextT = 0, wasRush = false;

function sfx(n, a) {
